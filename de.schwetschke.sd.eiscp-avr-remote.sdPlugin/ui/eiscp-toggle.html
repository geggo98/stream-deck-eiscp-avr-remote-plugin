<!DOCTYPE html>
<html>

<head lang="en">
    <title>eISCP Toggle Settings</title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ws://127.0.0.1:* ws://localhost:*" />
    <script src="vendor/sdpi-components.js"></script>
    <script src="commands.js"></script>
    <script src="eiscp-pi.js"></script>
    <link rel="stylesheet" href="eiscp-pi.css" />
</head>

<body>
    <div id="deviceIp"></div>

    <div class="sdpi-divider" style="margin: 16px 0;"></div>

    <sdpi-item label="Command">
        <sdpi-select setting="command" placeholder="Select command..."></sdpi-select>
    </sdpi-item>

    <sdpi-item label="On Value">
        <sdpi-select setting="onValue" placeholder="Default (from command)">
            <option value="01">On (01)</option>
            <option value="TG">Toggle (TG)</option>
            <option value="UP">Up (UP)</option>
            <option value="custom">Custom...</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Custom On Value" id="customOnValueItem" style="display: none;">
        <sdpi-textfield setting="customOnValue" placeholder="e.g. 02, FF"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Off Value">
        <sdpi-select setting="offValue" placeholder="Default (from command)">
            <option value="00">Off (00)</option>
            <option value="TG">Toggle (TG)</option>
            <option value="DOWN">Down (DOWN)</option>
            <option value="custom">Custom...</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Custom Off Value" id="customOffValueItem" style="display: none;">
        <sdpi-textfield setting="customOffValue" placeholder="e.g. 02, FF"></sdpi-textfield>
    </sdpi-item>

    <script src="init/eiscp-toggle.js"></script>
</body>

</html>
