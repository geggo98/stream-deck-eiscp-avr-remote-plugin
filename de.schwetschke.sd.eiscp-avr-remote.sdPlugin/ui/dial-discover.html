<!DOCTYPE html>
<html>

<head lang="en">
    <title>eISCP Dial Settings</title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ws://127.0.0.1:* ws://localhost:*" />
    <script src="vendor/sdpi-components.js"></script>
    <script src="commands.js"></script>
    <script src="eiscp-pi.js"></script>
    <style>
        /* The PI's default text colour is black, which is unreadable on the dark
           panel; sdpi only themes its own components. Give our plain text a light
           colour (like the sdpi labels, rgb(150,150,150)) so it is legible. */
        .pi-hint { color: #a0a0a0; font-size: 12px; margin: 4px 4px 2px; line-height: 1.3; }
        /* Trim the trailing scrollbar: content is tightened to fit; if the panel
           is very short it still scrolls (wheel), the bar just stays hidden. */
        ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
</head>

<body>
    <div id="deviceIp"></div>

    <sdpi-item label="Press action">
        <sdpi-select setting="pressAction" default="mute">
            <option value="mute">Mute</option>
            <option value="direct">Direct (Pure Audio)</option>
            <option value="stereo">Stereo mode</option>
        </sdpi-select>
    </sdpi-item>

    <div class="sdpi-divider" style="margin: 6px 0;"></div>

    <div id="discover"></div>

    <p class="pi-hint">
        Rotate to change the option; the touch strip shows the receiver's own name for it.
        Names are also learned automatically as you use the receiver — Auto-Discover fills
        them all in one pass. Press runs the chosen action above.
    </p>

    <script src="init/dial-discover.js"></script>
</body>

</html>
