<!DOCTYPE html>
<html>

<head lang="en">
    <title>eISCP Button Settings</title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ws://127.0.0.1:* ws://localhost:*" />
    <script src="vendor/sdpi-components.js"></script>
    <script src="commands.js"></script>
    <script src="eiscp-pi.js"></script>
</head>

<body>
    <div id="deviceIp"></div>

    <div class="sdpi-divider" style="margin: 16px 0;"></div>

    <sdpi-item label="Command">
        <sdpi-select setting="command" placeholder="Select command..."></sdpi-select>
    </sdpi-item>

    <sdpi-item label="Value">
        <sdpi-select setting="parameter" placeholder="Select value...">
            <option value="UP" data-keep>Up (UP)</option>
            <option value="DOWN" data-keep>Down (DOWN)</option>
            <option value="TG" data-keep>Toggle (TG)</option>
            <option value="01" data-keep>On (01)</option>
            <option value="00" data-keep>Off (00)</option>
            <option value="QSTN" data-keep>Query (QSTN)</option>
            <option value="custom" data-keep>Custom / pick from list…</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Custom Value" id="customParameterItem" style="display: none;">
        <sdpi-select setting="customParameter" placeholder="Pick a value for this command…"></sdpi-select>
    </sdpi-item>

    <script src="init/eiscp-button.js"></script>
</body>

</html>
