<!DOCTYPE html>
<html>

<head lang="en">
    <title>eISCP Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <script src="commands.js"></script>
    <script src="eiscp-pi.js"></script>
</head>

<body>
    <div id="deviceIp"></div>

    <div class="sdpi-divider" style="margin: 16px 0;"></div>

    <div id="discover"></div>

    <p style="opacity: 0.6; font-size: 11px; margin: 12px 4px;">
        Names are also learned automatically as you use the receiver (front panel, remote, or
        this plugin). Auto-Discover fills them all in one pass.
    </p>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            EiscpPI.renderDeviceIp('deviceIp');
            EiscpPI.renderDiscover('discover', 'option');
        });
    </script>
</body>

</html>
