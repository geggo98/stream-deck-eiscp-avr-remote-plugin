<!DOCTYPE html>
<html>

<head lang="en">
    <title>eISCP Dial Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <script src="commands.js"></script>
    <script src="eiscp-pi.js"></script>
</head>

<body>
    <div id="deviceIp"></div>

    <sdpi-item label="Press action">
        <sdpi-select setting="pressAction" default="mute">
            <option value="mute">Mute</option>
            <option value="direct">Direct (Pure Audio)</option>
            <option value="stereo">Stereo mode</option>
        </sdpi-select>
    </sdpi-item>

    <p style="opacity: 0.6; font-size: 11px; margin: 12px 4px;">
        Rotate to adjust. Press runs the chosen action. "Direct" only has an effect on
        receivers that support the DIR command (some Pioneer units ignore it).
    </p>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            EiscpPI.renderDeviceIp('deviceIp');
        });
    </script>
</body>

</html>
