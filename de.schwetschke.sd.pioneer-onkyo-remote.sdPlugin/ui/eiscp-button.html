<!DOCTYPE html>
<html>

<head lang="en">
    <title>eISCP Button Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Device IP">
        <sdpi-select setting="deviceIp" placeholder="Select device">
            <optgroup label="Pre-configured">
                <option value="10.2.0.32">Receiver (10.2.0.32)</option>
            </optgroup>
            <option value="custom">Custom IP...</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Custom IP" id="customIpItem" style="display: none;">
        <sdpi-textfield setting="customIp" placeholder="192.168.1.100"></sdpi-textfield>
    </sdpi-item>

    <div class="sdpi-divider" style="margin: 16px 0;"></div>

    <sdpi-item label="Command">
        <sdpi-select setting="command">
            <optgroup label="Volume">
                <option value="MVL">Master Volume (MVL)</option>
                <option value="CTL">Center Level (CTL)</option>
            </optgroup>
            <optgroup label="Power / Mute">
                <option value="PWR">Power (PWR)</option>
                <option value="AMT">Audio Muting (AMT)</option>
            </optgroup>
            <optgroup label="Input / Mode">
                <option value="SLI">Input Selector (SLI)</option>
                <option value="LMD">Listening Mode (LMD)</option>
                <option value="HDO">HDMI Output (HDO)</option>
                <option value="DIM">Dimmer (DIM)</option>
            </optgroup>
            <optgroup label="Speaker">
                <option value="SPA">Speaker A (SPA)</option>
                <option value="SPB">Speaker B (SPB)</option>
            </optgroup>
            <optgroup label="Audio Processing">
                <option value="DIR">Direct (DIR)</option>
                <option value="LTN">Late Night (LTN)</option>
                <option value="RAS">Cinema Filter (RAS)</option>
                <option value="ADY">Audyssey EQ (ADY)</option>
                <option value="ADQ">Audyssey Dynamic EQ (ADQ)</option>
                <option value="PMB">Phase Matching Bass (PMB)</option>
            </optgroup>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Parameter">
        <sdpi-textfield setting="parameter" placeholder="e.g. UP, DOWN, 01, TG"></sdpi-textfield>
    </sdpi-item>

    <script>
        const deviceIpEl = document.querySelector('[setting="deviceIp"]');
        const customIpItem = document.getElementById('customIpItem');
        if (deviceIpEl) {
            deviceIpEl.addEventListener('change', () => {
                customIpItem.style.display = deviceIpEl.value === 'custom' ? 'block' : 'none';
            });
        }
    </script>
</body>

</html>
