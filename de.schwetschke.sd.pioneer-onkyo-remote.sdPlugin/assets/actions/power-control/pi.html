<!DOCTYPE html>
<html>

<head lang="en">
    <title>Power Control Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
</head>

<body>
    <!-- Global Device IP Setting -->
    <sdpi-item label="Device IP" style="margin-bottom: 16px;">
        <sdpi-select
            id="deviceIpSelect"
            setting="deviceIp"
            placeholder="Select device"
            onchange="handleDeviceIpChange()">
            <optgroup label="Pre-configured">
                <option value="10.2.0.32">Receiver (10.2.0.32)</option>
            </optgroup>
            <option value="custom">Custom IP...</option>
        </sdpi-select>
    </sdpi-item>

    <!-- Custom IP Input (shown when "custom" is selected) -->
    <sdpi-item label="Custom IP Address" id="customIpItem" style="display: none;">
        <sdpi-textfield
            id="customIpInput"
            setting="customIp"
            placeholder="192.168.1.100"
            onchange="handleCustomIpChange()">
        </sdpi-textfield>
    </sdpi-item>

    <div class="sdpi-divider" style="margin: 16px 0;"></div>

    <!-- Power Mode Setting -->
    <sdpi-item label="Power Mode">
        <sdpi-select
            setting="powerMode"
            default="toggle"
            value-type="string">
            <option value="on">Power On</option>
            <option value="off">Power Off</option>
            <option value="toggle">Toggle</option>
        </sdpi-select>
    </sdpi-item>

    <script>
        // Handle device IP selection change
        function handleDeviceIpChange() {
            const select = document.getElementById('deviceIpSelect');
            const customIpItem = document.getElementById('customIpItem');
            const customIpInput = document.getElementById('customIpInput');

            if (select.value === 'custom') {
                // Show custom IP input
                customIpItem.style.display = 'block';
                // If there's a custom IP value, use it; otherwise clear the deviceIp
                if (customIpInput.value) {
                    // Keep custom IP value
                }
            } else {
                // Hide custom IP input and use selected IP
                customIpItem.style.display = 'none';
                // Update the deviceIp setting directly
                window.settings.deviceIp = select.value;
                // Notify Stream Deck of the change
                if (window.setSettings) {
                    window.setSettings({ deviceIp: select.value });
                }
            }
        }

        // Handle custom IP input change
        function handleCustomIpChange() {
            const customIpInput = document.getElementById('customIpInput');
            const ip = customIpInput.value.trim();

            if (ip) {
                // Update deviceIp with custom value
                window.settings.deviceIp = ip;
                // Notify Stream Deck of the change
                if (window.setSettings) {
                    window.setSettings({ deviceIp: ip });
                }
            }
        }

        // Initialize on load
        function initialize() {
            const select = document.getElementById('deviceIpSelect');
            const customIpItem = document.getElementById('customIpItem');
            const customIpInput = document.getElementById('customIpInput');

            // Get current settings
            if (window.settings && window.settings.deviceIp) {
                const currentIp = window.settings.deviceIp;

                // Check if current IP matches a pre-configured option
                let found = false;
                for (const option of select.options) {
                    if (option.value === currentIp) {
                        select.value = currentIp;
                        found = true;
                        break;
                    }
                }

                // If not found in pre-configured options, show as custom
                if (!found) {
                    select.value = 'custom';
                    customIpInput.value = currentIp;
                    customIpItem.style.display = 'block';
                }
            }

            // Show/hide custom IP input based on initial selection
            if (select.value === 'custom') {
                customIpItem.style.display = 'block';
            } else {
                customIpItem.style.display = 'none';
            }
        }

        // Run initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
</body>

</html>
