name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, validate, pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix (devenv binary cache)
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Typecheck, build, test, validate, pack (through devenv)
        run: |
          devenv shell -- bash -ceuo pipefail '
            npm ci
            npm run typecheck
            npm run build
            npm test
            npm run validate
            npm run pack
          '

      - name: Upload plugin bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamdeck-plugin
          path: "*.streamDeckPlugin"
          if-no-files-found: error
          retention-days: 14

  test-macos:
    # The dns-sd (AirPlay discovery) spawn/streaming logic only runs on
    # macOS; without this job it never executes in CI at all. Plain Node
    # instead of the devenv/Nix setup keeps the macOS minutes cheap — the
    # full toolchain is exercised by the ubuntu job above.
    name: Test on macOS (dns-sd coverage)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test
        run: |
          npm ci
          npm run typecheck
          npm test

  security:
    name: Vulnerability + license scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix (devenv binary cache)
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Verify all GitHub Actions are pinned to a commit SHA
        run: devenv shell -- pinact run --check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: osv-scanner (vulnerabilities, gates the build)
        run: devenv shell -- npm run scan:vulns

      - name: osv-scanner (license report, informational)
        # Truly informational: --licenses queries the external deps.dev service,
        # which is intermittently unavailable ("rpc error: ... service
        # unavailable") and would otherwise fail the whole job. The gating
        # vulnerability scan above does not touch deps.dev.
        continue-on-error: true
        run: devenv shell -- npm run scan
