name: Release

# release-please drives the whole release:
#   1. Every push to main opens/updates a "release" PR that maintains
#      CHANGELOG.md and bumps the version in package.json + package-lock.json
#      from the Conventional Commits. (The Stream Deck manifest's 4-part Version
#      is derived from package.json at build time by scripts/sync-manifest-version.ts,
#      not bumped by release-please — the CLI requires a 4-part version that 3-part
#      SemVer can't express.)
#   2. Merging that PR makes release-please create the vX.Y.Z tag + GitHub
#      Release; the publish job then builds and attaches the .streamDeckPlugin.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the release/tag and upload the .streamDeckPlugin asset
  pull-requests: write # open and update the release PR

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build and attach .streamDeckPlugin
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix (devenv binary cache)
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Build, validate, pack (through devenv)
        run: |
          devenv shell -- bash -ceuo pipefail '
            npm ci
            npm run build
            npm run validate
            npm run pack
          '

      - name: Attach .streamDeckPlugin to the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" *.streamDeckPlugin --clobber
