name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the .streamDeckPlugin asset

jobs:
  release:
    name: Build and publish .streamDeckPlugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix (devenv binary cache)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Build, validate, pack (through devenv)
        run: |
          devenv shell -- bash -ceuo pipefail '
            npm ci
            npm run build
            npm run validate
            npm run pack
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: "*.streamDeckPlugin"
          fail_on_unmatched_files: true
          generate_release_notes: true
